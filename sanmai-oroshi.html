<script>
(function () {
"use strict";
const { useState, useRef, useEffect, useMemo, useCallback } = React;
const html = htm.bind(React.createElement);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const VIEW = { x: 60, y: 55, w: 690, h: 270 };
const MIRROR_C = 800; // 裏返し時の鏡映の中心（x → 800 - x）

/* =========================================================
   魚の形状モデル
   体の輪郭は「吻端 X0 〜 尾の付け根 X1」の関数として定義する。
   ガイド線・判定・描画はすべてこの関数から作るため、
   魚種ごとにパラメータを変えれば形と判定が一緒に変わる。
   ========================================================= */
function makeBody(p) {
  const raw = (u) => { u = clamp(u, 0, 1); return Math.pow(u, p.ka) * Math.pow(1 - u, p.kb); };
  let m = 0; for (let i = 0; i <= 400; i++) m = Math.max(m, raw(i / 400));
  const uOf = (x) => (x - p.X0) / (p.X1 - p.X0);
  const f = (x) => raw(uOf(x)) / m;
  const base = (x) => lerp(p.snoutH, p.pedH, clamp(uOf(x), 0, 1));
  const Hd = (x) => base(x) + p.depthD * f(x);
  const Hv = (x) => base(x) * 0.9 + p.depthV * f(x);
  const top = (x) => p.CY - Hd(x);
  const bot = (x) => p.CY + Hv(x);
  return { ...p, f, Hd, Hv, top, bot };
}

function buildAji() {
  const B = makeBody({ X0: 100, X1: 600, CY: 185, ka: 0.55, kb: 0.9, depthD: 64, depthV: 57, snoutH: 5, pedH: 9, tailLen: 115, tailSpan: 62 });
  const { top, bot, Hd, Hv, CY } = B;
  const SPY = CY - 3; // 中骨の高さ
  const headT = { xTop: 228, xBot: 212 };
  headT.yTop = top(headT.xTop) - 4;
  headT.yBot = bot(headT.xBot) + 4;
  const headFn = (y) => lerp(headT.xTop, headT.xBot, (y - headT.yTop) / (headT.yBot - headT.yTop));
  const targets = {
    zeigo: { key: "zeigo", name: "ぜいご取り", axis: "x", a: 392, b: 594, fn: () => CY - 1, dir: -1, inward: 0,
      dirMsg: "ぜいごは尾側から頭側へ、包丁を寝かせて薄くそぎ取ります。逆向きだと硬いうろこに刃が引っかかります。" },
    head: { key: "head", name: "頭を落とす", axis: "y", a: headT.yTop, b: headT.yBot, fn: headFn, dir: 0, inward: 1 },
    gut: { key: "gut", name: "腹を切り開く", axis: "x", a: 218, b: 335, fn: (x) => bot(x) - 6, dir: 1, inward: -1,
      dirMsg: "腹は頭側の切り口から肛門に向かって切り開くと、刃先が内臓を傷つけにくくなります。" },
    belly: { key: "belly", name: "腹側の切り込み", axis: "x", a: 226, b: 592, fn: (x) => bot(x) - (3 + 0.1 * Hv(x)), dir: 1, inward: -1,
      dirMsg: "腹側は頭側から尾に向かって包丁を進めるのが基本です。骨の流れに沿うので身が崩れにくくなります。" },
    back: { key: "back", name: "背側の切り込み", axis: "x", a: 236, b: 592, fn: (x) => top(x) + (3 + 0.1 * Hd(x)), dir: -1, inward: 1,
      dirMsg: "背側は魚の向きを変え、尾側から頭に向かって切り進めます。" },
    spine: { key: "spine", name: "中骨に沿って切り離す", axis: "x", a: 232, b: 596, fn: () => SPY, dir: -1, inward: 0,
      dirMsg: "切り離しは尾の付け根に包丁を入れ、頭側へ中骨の上をすべらせます。" },
  };
  return {
    id: "aji", name: "アジ", kana: "あじ", available: true, B, SPY, headT, targets,
    eye: { x: 140, y: 168, r: 12 },
    anusX: 335,
    lateral: { arch: [[208, 167], [250, 156], [300, 160], [350, 175], [392, CY - 1]] },
    summary: "身が締まった初心者向けの魚。アジ特有の硬いうろこ「ぜいご」を取るのが特徴です。",
    prep: [
      { id: "board", label: "まな板を固定する", gesture: "tap", req: [],
        how: "「作業する」を押して、まな板の下に濡れ布巾を敷きます。",
        lesson: "まな板の下に固く絞った濡れ布巾を敷くと滑り止めになります。まな板が動くと包丁の軌道がぶれ、けがの原因になります。" },
      { id: "scale", label: "うろこを取る", gesture: "scrub", req: [], knife: true,
        how: "魚の体の上を、尾から頭の方向へこするようにドラッグします（9割以上できれいになります）。",
        lesson: "アジのうろこは細かく薄いので、包丁の刃先を立て気味にして尾から頭へ軽くこそげ取ります。うろこが残ると口当たりが悪くなります。" },
      { id: "zeigo", label: "ぜいごを取る", gesture: "line", target: "zeigo", req: [], knife: true,
        how: "尾の付け根から体の中央に並ぶ硬いうろこ（ぜいご）に沿って、頭の方向へドラッグし「決定」を押します。",
        lesson: "ぜいご（稜鱗）はアジの側線の後半に並ぶ硬いうろこです。包丁を寝かせて尾側から差し込み、前後に小さく動かしながらそぎ取ります。表と裏の両面にあります（このゲームでは1回の操作で両面とも取ったものとして扱います）。" },
      { id: "head", label: "頭を落とす", gesture: "line", target: "head", req: ["scale", "zeigo"], knife: true,
        reqWhy: "うろこやぜいごは、頭が付いているうちに取ります。頭があるほうが魚を押さえやすく、頭の切り口や腹の中にうろこが入り込むのも防げます。",
        how: "胸ビレのすぐ後ろを、背から腹へ（または腹から背へ）斜めになぞり「決定」を押します。",
        lesson: "胸ビレのすぐ後ろに包丁を入れ、頭を切り落とします。後ろに入れすぎると身が減り、前すぎると硬いえらぶたの骨が残ります。（このゲームでは表裏から入れる包丁を1本の線で表します）" },
      { id: "gut", label: "腹を開いて内臓を取る", gesture: "line", target: "gut", req: ["head"], knife: true,
        reqWhy: "この手順では、頭を落としてから腹を切り開きます。頭の切り口から内臓をかき出しやすくなります。（頭を付けたまま内臓を抜く方法もありますが、ここでは扱いません）",
        how: "頭の切り口から肛門まで、腹の縁に沿ってドラッグし「決定」を押します。",
        lesson: "腹を肛門まで浅く切り開き、内臓をかき出します。刃を深く入れると内臓を傷つけ、苦みや臭みが身に移ります。" },
      { id: "wash", label: "血合いを洗い、水気を拭く", gesture: "tap", req: ["gut"],
        reqWhy: "洗う前に内臓を取り除く必要があります。内臓と血合いを取ってから洗うことで、腹の中の汚れと臭みをまとめて落とせます。",
        how: "「作業する」を押して、中骨の下にある血合いをこそげ、流水で洗ってから水気を拭き取ります。",
        lesson: "中骨に沿った血合い（腎臓）は臭みの原因です。こそげて流水で洗い、キッチンペーパーで水気をしっかり拭きます。水気が残ると傷みやすく、包丁やまな板の上で滑りやすくもなります。" },
    ],
    distractors: [

        why: "塩をふるのは、おろした身を料理に使う段階の作業です。下処理の前にふると、うろこ取りや包丁さばきの邪魔になります。" },
    ],
    cutLessons: {
      belly: "腹側の切り込みは、尻ビレの付け根に沿って入れます。刃先を中骨に当てる感覚で、浅く何度かに分けて引くと身を傷めません。（ゲームでは1本の線で表します）",

const KEY_PARTS = ["head", "caudal", "back", "belly", "spine"];

/* =========================================================
   線の判定
   ========================================================= */
function resample(pts, step) {
  if (pts.length < 2) return pts.slice();
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    const n = Math.max(1, Math.ceil(d / step));
    for (let k = 1; k <= n; k++) out.push({ x: lerp(a.x, b.x, k / n), y: lerp(a.y, b.y, k / n) });
  }
  return out;
}
function pathLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return L; }

const NBIN = 40;
function evalStroke(rawPts, t, tol) {
  const pts = resample(rawPts, 3);
  const lo = Math.min(t.a, t.b), hi = Math.max(t.a, t.b), L = hi - lo;
  const bins = new Array(NBIN).fill(false);
  const sum = new Array(NBIN).fill(0), cnt = new Array(NBIN).fill(0);
  let absSum = 0, sgnSum = 0, inSum = 0, outSum = 0, n = 0, far = 0;
  for (const p of pts) {
    const s = t.axis === "x" ? p.x : p.y;
    if (s < lo - 4 || s > hi + 4) continue;
    const d = (t.axis === "x" ? p.y : p.x) - t.fn(s);
    n++; absSum += Math.abs(d); sgnSum += d;
    if (t.inward) { const w = d * t.inward; if (w > 0) inSum += w; else outSum += -w; }
    if (Math.abs(d) > 2 * tol) far++;
    const bi = clamp(Math.floor((s - lo) / L * NBIN), 0, NBIN - 1);
    if (Math.abs(d) < 4 * tol) { bins[bi] = true; sum[bi] += d; cnt[bi]++; }
  }
  const cov = bins.filter(Boolean).length / NBIN;
  const meanAbs = n ? absSum / n : Infinity;
  const first = pts[0], last = pts[pts.length - 1];
  const net = t.axis === "x" ? last.x - first.x : last.y - first.y;
  const dirOk = t.dir === 0 || Math.sign(net) === t.dir;
  const devBins = sum.map((v, i) => (cnt[i] ? v / cnt[i] : null));
  const acc = clamp(1 - Math.max(0, meanAbs - 0.5 * tol) / (2.5 * tol), 0, 1) * clamp(cov / 0.9, 0, 1);
  return {
    key: t.key, name: t.name, n, cov, meanAbs, meanSigned: n ? sgnSum / n : 0,
    inward: n ? inSum / n : 0, outward: n ? outSum / n : 0, farFrac: n ? far / n : 1,
    dirOk, devBins, acc, tol,
  };
}
function devAt(ev, t, x) {
  if (!ev) return 0;
  const lo = Math.min(t.a, t.b), hi = Math.max(t.a, t.b);
  const bi = clamp(Math.floor((x - lo) / (hi - lo) * NBIN), 0, NBIN - 1);
  for (let r = 0; r < NBIN; r++) {
    const a = ev.devBins[bi - r], b = ev.devBins[bi + r];
    if (a != null) return a; if (b != null) return b;
  }
  return 0;
}

// 魚の外側へのはみ出し距離（安全判定用）
function outsideDist(F, p, headOff) {
  const { B } = F;
  if (headOff) {
    const hx = F.targets.head.fn(clamp(p.y, F.headT.yTop, F.headT.yBot));
    if (p.x < hx) return Math.max(hx - p.x, p.y < B.top(hx) ? B.top(hx) - p.y : p.y > B.bot(hx) ? p.y - B.bot(hx) : 0);
  }
  if (p.x < B.X0) return Math.hypot(B.X0 - p.x, Math.max(0, Math.abs(p.y - B.CY) - 5));
  if (p.x <= B.X1) {
    if (p.y < B.top(p.x)) return B.top(p.x) - p.y;
    if (p.y > B.bot(p.x)) return p.y - B.bot(p.x);
    return 0;
  }
  const tx = p.x - B.X1;
  if (tx <= B.tailLen) { const span = B.tailSpan * tx / B.tailLen + 10; return Math.max(0, Math.abs(p.y - B.CY) - span); }
  return tx - B.tailLen;
}

/* =========================================================
   ゲーム状態
   ========================================================= */
const SCALE_COLS = 20, SCALE_ROWS = 3;
function scaleCells(F) {
  const { B } = F; const cells = [];
  for (let c = 0; c < SCALE_COLS; c++) {
    const x = lerp(150, 588, (c + 0.5) / SCALE_COLS);
    for (let r = 0; r < SCALE_ROWS; r++) {
      const t0 = r / SCALE_ROWS, t1 = (r + 1) / SCALE_ROWS;
      cells.push({ x, w: (588 - 150) / SCALE_COLS, y0: lerp(B.top(x), B.bot(x), t0), y1: lerp(B.top(x), B.bot(x), t1) });
    }
  }
  return cells;
}

function newGame(fishId, modeId) {
  return {

    side: "A", aRemoved: false,
    cuts: {}, // head, gut, zeigo, A_belly, A_back, A_spine, B_...
    pen: [], // {cat, pts, msg}
    overshoot: 0, fast: 0, boardLate: false, rejects: 0,

    lesson: null,
  };
}

function nextAdvice(g, F) {
  if (g.phase === "inspect") {
    const rest = KEY_PARTS.filter((k) => !g.seen.includes(k));
    if (rest.length) return { now: "部位の確認", next: "下処理", hint: `まだ確認していない主な部位：${rest.map((k) => PARTS[k].name).join("・")}。クリックして説明を読みましょう。中骨は「中骨を透かして見る」をオンにすると見えます。` };
    return { now: "部位の確認", next: "下処理", hint: "主な部位は確認できました。「下処理へ進む」を押しましょう。" };
  }
  if (g.phase === "prep") {
    const st = F.prep.find((s) => !g.prepDone[s.id]);
    if (g.activePrep) {
      const a = F.prep.find((s) => s.id === g.activePrep);
      return { now: a.label, next: st && st.id !== a.id ? st.label : "三枚おろし", hint: a.how, target: a.target };
    }
    if (!st) return { now: "下処理完了", next: "三枚おろし", hint: "下処理が終わりました。「三枚おろしへ進む」を押しましょう。" };
    const after = F.prep[F.prep.indexOf(st) + 1];
    return { now: "作業を選ぶ", next: st.label, hint: `次は「${st.label}」です。${st.how}`, suggest: st.id, target: st.target, nextAfter: after && after.label };
  }
  if (g.phase === "cut") {
    const s = g.side;
    const need = ["belly", "back", "spine"].filter((k) => !g.cuts[`${s}_${k}`]);
    if (s === "A" && !need.length) return { now: "片身が外れました", next: "裏返す", hint: "「魚を裏返す」を押して、2枚目に進みましょう。" };
    const order = s === "A" ? ["belly", "back", "spine"] : ["back", "belly", "spine"];
    const k = order.find((x) => need.includes(x));
    const t = F.targets[k];
    const where = { belly: "腹の縁の少し内側（尻ビレの付け根）を、頭側から尾へ", back: "背の縁の少し内側（背ビレの際）を、尾側から頭へ", spine: "体の中心の中骨の上を、尾の付け根から頭側へ" }[k];
    const sideName = s === "A" ? "1枚目（表）" : "2枚目（裏）";
    return { now: `${sideName}：${t.name}`, next: k === "spine" ? (s === "A" ? "裏返す" : "仕上がり確認") : "中骨に沿って切り離す", hint: `${where}ドラッグして「決定」を押します。${s === "B" ? "裏返したので頭は右側にあります。" : ""}`, target: k };
  }
  return { now: "仕上がり確認", next: "—", hint: "" };
}

/* =========================================================
   採点
   ========================================================= */
function computeScore(g, F, mode, extra) {
  const tol = mode.tol;
  const C = g.cuts;
  const sides = ["A", "B"];
  // 作業手順 20
  const procPen = g.pen.filter((p) => p.cat === "proc").reduce((a, p) => a + p.pts, 0) + (mode.id === "master" ? extra.undos : 0);
  const procItems = g.pen.filter((p) => p.cat === "proc").map((p) => `−${p.pts}：${p.msg}`);
  if (mode.id === "master" && extra.undos) procItems.push(`−${extra.undos}：職人モードでの「戻る」${extra.undos}回`);
  const proc = clamp(20 - procPen, 0, 20);

  // 切断線の正確さ 30
  const W = [["head", 0.5], ["gut", 0.5], ["A_belly", 1], ["A_back", 1], ["A_spine", 1], ["B_belly", 1], ["B_back", 1], ["B_spine", 1]];
  let wsum = 0, asum = 0; for (const [k, w] of W) { wsum += w; asum += w * (C[k] ? C[k].acc : 0); }
  const accRate = asum / wsum;
  const accuracy = Math.round(30 * accRate * 10) / 10;

  // 身の残り具合 25（推定）
  const slack = 0.3 * tol;
  const sideYield = sides.map((s) => {
    const back = C[`${s}_back`], belly = C[`${s}_belly`], sp = C[`${s}_spine`];
    let loss = 0;
    loss += 50 * Math.max(0, back.inward - slack) / 55;
    loss += 50 * Math.max(0, belly.inward - slack) / 48;
    loss += 0.8 * 100 * Math.max(0, sp.meanAbs - slack) / 110;
    for (const c of [back, belly, sp]) loss += Math.max(0, 0.95 - c.cov) * 30;
    loss += 100 * Math.max(0, C.head.meanSigned - slack) / 370;
    return clamp(100 - loss, 30, 100);
  });
  const yieldPct = (sideYield[0] + sideYield[1]) / 2;
  const yieldScore = Math.round(25 * clamp((yieldPct - 70) / (97 - 70), 0, 1) * 10) / 10;

  // 骨の処理 15
  const zeigoPts = 5 * clamp(C.zeigo.cov / 0.9, 0, 1);
  const outs = sides.flatMap((s) => [C[`${s}_back`].outward, C[`${s}_belly`].outward]);
  const outAvg = outs.reduce((a, b) => a + b, 0) / outs.length;
  const finPts = 5 * clamp(1 - Math.max(0, outAvg - slack) / (1.5 * tol), 0, 1);
  const farAvg = (C.A_spine.farFrac + C.B_spine.farFrac) / 2;
  const spinePts = 5 * clamp(1 - farAvg * 1.5, 0, 1);
  const bone = Math.round((zeigoPts + finPts + spinePts) * 10) / 10;

  // 安全 10
  const boardPts = g.boardLate ? 0 : 4;
  const overPts = clamp(3 - g.overshoot, 0, 3);
  const fastPts = clamp(3 - g.fast, 0, 3);
  const safety = boardPts + overPts + fastPts;

  const total = Math.round(proc + accuracy + yieldScore + bone + safety);
  const cats = [
    { key: "proc", name: "作業手順", pts: proc, max: 20, items: [
      { tag: "m", text: procItems.length ? `減点の記録：${procItems.length}件` : "工程の順序・向きの誤りはありませんでした。" },
      ...procItems.map((t) => ({ tag: "m", text: t }))] },
    { key: "acc", name: "切断線の正確さ", pts: accuracy, max: 30, items: [
      { tag: "m", text: `8本の切断線の平均的な正確さ ${Math.round(accRate * 100)}%（目標線からのずれと、切り込みの長さから計算。許容幅 ${tol}）` }] },
    { key: "yield", name: "身の残り具合", pts: yieldScore, max: 25, items: [
      { tag: "e", text: `推定歩留まり ${yieldPct.toFixed(1)}%（理想的なおろし方を100%とした簡易モデル。1枚目 ${sideYield[0].toFixed(1)}%・2枚目 ${sideYield[1].toFixed(1)}%）` },
      { tag: "e", text: "身側へのずれ・中骨からの離れ・切り込み不足・頭の落とし位置から推定しています。実際の重さは測っていません。" }] },
    { key: "bone", name: "骨の処理", pts: bone, max: 15, items: [
      { tag: "m", text: `ぜいごの除去範囲 ${Math.round(C.zeigo.cov * 100)}% → ${zeigoPts.toFixed(1)}/5` },
      { tag: "e", text: `ヒレの骨の残り（背・腹の切り込みが外側へずれた量から推定）→ ${finPts.toFixed(1)}/5` },
      { tag: "e", text: `中骨への食い込み・骨片の混入（中骨から大きく外れた割合 ${Math.round(farAvg * 100)}% から推定）→ ${spinePts.toFixed(1)}/5` }] },
    { key: "safety", name: "安全な作業", pts: safety, max: 10, items: [
      { tag: "m", text: g.boardLate ? "まな板を固定する前に刃物を使いました → 0/4" : "刃物を使う前にまな板を固定しました → 4/4" },
      { tag: "m", text: `魚から大きくはみ出した切断操作 ${g.overshoot}回 → ${overPts}/3` },
      { tag: "e", text: `勢いよく引きすぎた操作 ${g.fast}回（ドラッグの速さから推定）→ ${fastPts}/3` },
      { tag: "e", text: "押さえる手の位置や包丁の角度は、このゲームでは判定していません。" }] },
  ];
  let rank;
  if (total >= 90) rank = { r: "S", name: "職人級" };
  else if (total >= 80) rank = { r: "A", name: "一人前" };
  else if (total >= 65) rank = { r: "B", name: "見習い上級" };
  else if (total >= 50) rank = { r: "C", name: "見習い" };
  else rank = { r: "D", name: "修行中" };
  return { total, cats, rank, yieldPct, sideYield, accRate };
}

function feedbackLists(g, F, sc, mode) {
  const C = g.cuts; const good = [], bad = [], next = [];
  const cutKeys = ["head", "gut", "A_belly", "A_back", "A_spine", "B_belly", "B_back", "B_spine"];
  const named = (k) => (k.startsWith("A_") ? "1枚目の" : k.startsWith("B_") ? "2枚目の" : "") + C[k].name;
  const sorted = cutKeys.slice().sort((a, b) => C[b].acc - C[a].acc);
  const best = sorted[0], worst = sorted[sorted.length - 1];
  if (C[best].acc >= 0.8) good.push(`${named(best)}は目標線から平均${C[best].meanAbs.toFixed(1)}のずれで、正確に切れています。`);
  const cat = Object.fromEntries(sc.cats.map((c) => [c.key, c]));
  if (cat.proc.pts >= 18) good.push("工程の順序を正しく守れています。下処理から三枚おろしまでの流れが身についています。");
  if (cat.safety.pts >= 9) good.push("まな板の固定やはみ出しのない包丁さばきなど、安全面に配慮できています。");
  if (sc.yieldPct >= 92) good.push(`身を大きく削らずにおろせています（推定歩留まり ${sc.yieldPct.toFixed(1)}%）。`);
  if (C.zeigo.cov >= 0.9) good.push("ぜいごを尾の付け根から前半まで取り切れています。");
  if (!good.length) good.push("最後まで三枚に分けることができました。どこでずれたかを確認して、次に生かしましょう。");

  const w = C[worst];
  if (w.acc < 0.75) {
    const t = F.targets[w.key];
    let dirText = "";
    if (t.inward) dirText = w.meanSigned * t.inward > 0 ? "身の内側へ" : "外側（縁）へ";
    else if (t.axis === "x") dirText = w.meanSigned < 0 ? "上（背側）へ" : "下（腹側）へ";
    bad.push(`${named(worst)}が目標線から平均${w.meanAbs.toFixed(1)}${dirText ? "、主に" + dirText : ""}ずれています（許容幅 ${mode.tol}）。${w.cov < 0.85 ? `切り込みが全長の${Math.round(w.cov * 100)}%しか届いていません。` : ""}`);
  }
  for (const s of ["A", "B"]) {
    const b = C[`${s}_back`], l = C[`${s}_belly`];
    if (b.inward > 0.6 * mode.tol) bad.push(`${s === "A" ? "1" : "2"}枚目の背側の切り込みが身の内側に入りすぎ、背の身が削れています。背ビレの際をなぞる意識を持ちましょう。`);
    if (l.inward > 0.6 * mode.tol) bad.push(`${s === "A" ? "1" : "2"}枚目の腹側の切り込みが身の内側に入りすぎています。腹の身は薄いので、縁に近いところを浅く切ります。`);
  }
  if ((C.A_spine.meanAbs + C.B_spine.meanAbs) / 2 > 0.6 * mode.tol) bad.push("中骨に沿う切り離しで刃が骨から離れ、中骨に身が残っています。刃を中骨に当てたまま、すべらせる感覚で進めます。");
  if (C.head.meanSigned > 0.6 * mode.tol) bad.push("頭を落とす位置が後ろ寄りで、肩の身が頭側に付いて捨てられています。胸ビレのすぐ後ろを狙いましょう。");
  if (C.head.meanSigned < -0.8 * mode.tol) bad.push("頭を落とす位置が前寄りです。えらぶたの硬い骨が身に残りやすくなります。");
  if (g.pen.some((p) => p.cat === "proc")) bad.push("工程の順序や包丁の向きで減点がありました。結果の「作業手順」の記録を確認しましょう。");
  if (g.boardLate) bad.push("まな板を固定する前に包丁を使いました。刃物を持つ前に、まず作業台を安定させます。");
  if (g.overshoot) bad.push(`包丁の線が魚から大きくはみ出した操作が${g.overshoot}回ありました。刃先の行き先に手や体がないか常に意識しましょう。`);
  if (g.fast) bad.push(`勢いよく引きすぎた操作が${g.fast}回ありました。包丁は力まず、一定の速さで動かします。`);
  if (!bad.length) bad.push("大きな改善点はありません。より厳しいモードに挑戦しましょう。");

  const low = sc.cats.slice().sort((a, b) => a.pts / a.max - b.pts / b.max)[0];
  const tips = {
    proc: "下処理の順番（固定 → うろこ → ぜいご → 頭 → 内臓 → 洗う）と、切り込みの向き（腹は頭→尾、背は尾→頭）を声に出して確認してから作業しましょう。",
    acc: "ガイド線の始点と終点を先に目で確認し、指やマウスをゆっくり一定の速さで動かしてみましょう。",
    yield: "背と腹の切り込みは縁の近く、切り離しは中骨にぴったり沿わせることを意識して、身を削らないおろし方を目指しましょう。",
    bone: "ぜいごは尾の付け根から前半まで取り切り、切り離しでは中骨から刃を離さないようにしましょう。",
    safety: "作業の最初にまな板を固定し、魚の外へ刃先が飛び出さないよう、短く区切って切り進めましょう。",
  };
  next.push(`重点課題「${low.name}」：${tips[low.key]}`);
  if (sc.total >= 80 && mode.id !== "master") next.push(`総合${sc.total}点です。次は${mode.id === "practice" ? "通常モード" : "職人モード"}で、ガイドの少ない状態に挑戦しましょう。`);
  else if (sc.total < 80) next.push("同じモードでもう一度挑戦し、80点（ランクA）を目指しましょう。");
  else next.push("職人モードで90点（ランクS）以上を安定して出せるよう練習しましょう。");
  return { good, bad, next };
}

/* =========================================================
   SVG 描画部品
   ========================================================= */
function polyD(pts) { return pts.length ? "M" + pts.map((p) => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" L") : ""; }
function bodyOutline(B) {
  const pts = [{ x: B.X0 - 7, y: B.CY + 1 }];
  for (let x = B.X0; x <= B.X1; x += 4) pts.push({ x, y: B.top(x) });
  for (let x = B.X1; x >= B.X0; x -= 4) pts.push({ x, y: B.bot(x) });
  return polyD(pts) + " Z";
}
function targetPts(t, step = 4) {
  const pts = []; const lo = Math.min(t.a, t.b), hi = Math.max(t.a, t.b);
  for (let s = lo; s <= hi + 0.01; s += step) pts.push(t.axis === "x" ? { x: s, y: t.fn(s) } : { x: t.fn(s), y: s });
  return pts;
}
function headClipPoly(F, dev) {
  const { headT } = F; const d = dev || 0;
  const k = (headT.xBot - headT.xTop) / (headT.yBot - headT.yTop);
  const xAt = (y) => headT.xTop + d + k * (y - headT.yTop);
  return `${xAt(0)},0 900,0 900,400 ${xAt(400)},400`;
}

function FishDefs() {

function Board({ cloth }) {

function Fins({ F, p }) {
  const { B } = F; const t = B.top, b = B.bot, CY = B.CY;
  const X1 = B.X1;
  const dorsal1 = `M250 ${t(250)} L262 ${t(262) - 30} L276 ${t(276) - 27} L290 ${t(290) - 18} L302 ${t(302)} Z`;
  let d2 = `M318 ${t(318)} L322 ${t(322) - 17}`; for (let x = 340; x <= 560; x += 20) d2 += ` L${x} ${t(x) - lerp(15, 7, (x - 340) / 220)}`; d2 += ` L568 ${t(568)} Z`;
  let an = `M352 ${b(352)} L356 ${b(356) + 15}`; for (let x = 372; x <= 560; x += 20) an += ` L${x} ${b(x) + lerp(13, 7, (x - 372) / 188)}`; an += ` L568 ${b(568)} Z`;
  const caudal = `M${X1 - 4} ${t(X1 - 4) + 1} C${X1 + 40} ${CY - 25} ${X1 + 80} ${CY - 50} ${X1 + B.tailLen} ${CY - B.tailSpan} C${X1 + 95} ${CY - 25} ${X1 + 72} ${CY - 6} ${X1 + 70} ${CY} C${X1 + 72} ${CY + 6} ${X1 + 95} ${CY + 25} ${X1 + B.tailLen} ${CY + B.tailSpan} C${X1 + 80} ${CY + 50} ${X1 + 40} ${CY + 25} ${X1 - 4} ${b(X1 - 4) - 1} Z`;
  const pelvic = `M226 ${b(226) - 2} L238 ${b(238) + 18} L250 ${b(250) + 3} Z`;
  return html`<g>
    <path d=${caudal} fill="url(#fin)" stroke="#5f6f70" stroke-width="1" ...${p("caudal")}/>
    <path d=${dorsal1} fill="url(#fin)" stroke="#5f6f70" stroke-width="1" ...${p("dorsal")}/>
    <path d=${d2} fill="url(#fin)" stroke="#5f6f70" stroke-width="1" ...${p("dorsal")}/>
    <path d=${an} fill="url(#fin)" stroke="#5f6f70" stroke-width="1" ...${p("anal")}/>
    <path d=${pelvic} fill="url(#fin)" stroke="#5f6f70" stroke-width="1" ...${p("pelvic")}/>
  </g>`;
}

function Skeleton({ F, remnant }) {
  // remnant: x => 中骨に残った身の厚み
  const { B, SPY } = F; const parts = [];
  const xs = []; for (let x = 232; x <= 596; x += 6) xs.push(x);
  if (remnant) {
    const up = xs.map((x) => ({ x, y: SPY - 4 - remnant(x) })), dn = xs.slice().reverse().map((x) => ({ x, y: SPY + 4 + remnant(x) }));
    parts.push(html`<path key="rem" d=${polyD(up.concat(dn)) + " Z"} fill="#d98f80" opacity="0.85"/>`);
  }
  for (let x = 240; x <= 584; x += 12) {
    const h = B.Hd(x) * 0.7, v = x < F.anusX ? B.Hv(x) * 0.8 : B.Hv(x) * 0.6;
    parts.push(html`<path key=${"n" + x} d=${`M${x} ${SPY - 3} L${x + 9} ${SPY - h}`} stroke="#f3eee6" stroke-width="1.6" opacity="0.9"/>`);
    parts.push(html`<path key=${"h" + x} d=${`M${x} ${SPY + 3} ${x < F.anusX ? `Q${x - 2} ${SPY + v * 0.6} ${x + 8} ${SPY + v}` : `L${x + 9} ${SPY + v}`}`} fill="none" stroke="#f3eee6" stroke-width="1.6" opacity="0.9"/>`);
  }
  parts.push(html`<path key="sp" d=${`M228 ${SPY} L600 ${SPY}`} stroke="#fbf8f2" stroke-width="7" stroke-linecap="round"/>`);
  parts.push(html`<path key="sp2" d=${`M228 ${SPY} L600 ${SPY}`} stroke="#c9bfb0" stroke-width="1" stroke-dasharray="3 5"/>`);
  return html`<g>${parts}</g>`;
}

function filletPath(F, g, s, offY = 0) {
  const { B, targets, SPY } = F; const C = g.cuts;
  const hx = targets.head.fn(B.CY) + (C.head ? C.head.meanSigned : 0) + 4;
  const back = C[`${s}_back`], belly = C[`${s}_belly`];
  const xs = []; for (let x = Math.max(hx, 226); x <= 592; x += 5) xs.push(x);
  const topPts = xs.map((x) => ({ x, y: clamp(targets.back.fn(x) + devAt(back, targets.back, x), B.top(x) + 1, SPY - 2) + offY }));
  const botPts = xs.slice().reverse().map((x) => ({ x, y: clamp(targets.belly.fn(x) + devAt(belly, targets.belly, x), SPY + 2, B.bot(x) - 1) + offY }));
  return polyD(topPts.concat([{ x: 598, y: SPY + offY }], botPts)) + " Z";
}

function Fillet({ F, g, s, offY = 0, mirror }) {
  const { SPY, targets, B } = F; const C = g.cuts;
  const back = C[`${s}_back`], belly = C[`${s}_belly`];
  const ticks = [];
  for (let x = 240; x <= 580; x += 8) {
    const db = devAt(back, targets.back, x) * targets.back.inward;
    if (db < -0.6 * back.tol) { const y = clamp(targets.back.fn(x) + devAt(back, targets.back, x), B.top(x) + 1, SPY) + offY; ticks.push(html`<path key=${"b" + x} d=${`M${x} ${y} l3 7`} stroke="#fffaf0" stroke-width="1.6"/>`); }
    const dl = devAt(belly, targets.belly, x) * targets.belly.inward;
    if (dl < -0.6 * belly.tol) { const y = clamp(targets.belly.fn(x) + devAt(belly, targets.belly, x), SPY, B.bot(x) - 1) + offY; ticks.push(html`<path key=${"l" + x} d=${`M${x} ${y} l3 -7`} stroke="#fffaf0" stroke-width="1.6"/>`); }
  }
  const tr = mirror ? `translate(${MIRROR_C} 0) scale(-1 1)` : undefined;
  return html`<g transform=${tr}>
    <path d=${filletPath(F, g, s, offY)} fill="url(#flesh)" stroke="#b86b5e" stroke-width="1.2"/>
    <path d=${`M250 ${SPY + offY} Q420 ${SPY - 3 + offY} 590 ${SPY + offY}`} stroke="#9e3b3b" stroke-width="5" opacity="0.45" fill="none" stroke-linecap="round"/>
    ${ticks}
  </g>`;
}

function GuideLine({ t, faint, arrow }) {
  const pts = targetPts(t);
  let ordered = pts;
  if (t.dir === -1) ordered = pts.slice().reverse();
  return html`<g pointer-events="none">
    <path d=${polyD(ordered)} fill="none" stroke="var(--guide)" stroke-width=${faint ? 2 : 3} stroke-dasharray=${faint ? "4 6" : "9 6"} opacity=${faint ? 0.55 : 0.95}
      marker-end=${arrow && t.dir !== 0 ? "url(#arrow)" : undefined}/>
    ${arrow && html`<circle cx=${ordered[0].x} cy=${ordered[0].y} r="5" fill="var(--guide)"/>`}
  </g>`;
}

/* =========================================================
   まな板ビュー（メインの操作SVG）
   ========================================================= */
function FishView({ F, g, mode, guideKeys, draft, onPart, drawMode, onStroke, onScrub, hintFlash }) {
  const svgRef = useRef(null);
  const stroke = useRef(null);
  const [live, setLive] = useState(null);
  const { B } = F;
  const mirrored = g.phase === "cut" && g.side === "B";
  const toFish = (p) => (mirrored ? { x: MIRROR_C - p.x, y: p.y } : p);

  const getPt = (e) => {
    const svg = svgRef.current; if (!svg) return null;
    const m = svg.getScreenCTM(); if (!m) return null;
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(m.inverse());
    return toFish({ x: q.x, y: q.y });
  };
  const down = (e) => {
    if (drawMode === "none") return;
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();
    try { svgRef.current.setPointerCapture(e.pointerId); } catch (_) {}
    const p = getPt(e); if (!p) return;
    stroke.current = { id: e.pointerId, pts: [p], t0: performance.now() };
    if (drawMode === "scrub") onScrub("start", p, null);
    setLive([p]);
  };
  const move = (e) => {
    const s = stroke.current; if (!s || s.id !== e.pointerId) return;
    const p = getPt(e); if (!p) return;
    const last = s.pts[s.pts.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) < 2) return;
    s.pts.push(p);
    if (drawMode === "scrub") onScrub("move", p, last);
    setLive(s.pts.slice());
  };
  const up = (e) => {
    const s = stroke.current; if (!s || s.id !== e.pointerId) return;
    stroke.current = null; setLive(null);
    const dur = performance.now() - s.t0;
    if (drawMode === "scrub") onScrub("end", null, null);
    else if (s.pts.length >= 2 && pathLen(s.pts) > 12) onStroke({ pts: s.pts, dur });
  };

  const headOff = !!g.prepDone.head && g.phase !== "inspect";
  const showSkin = !(g.phase === "cut" && g.side === "A" && g.aRemoved);
  const clickable = g.phase === "inspect";
  const p = (key) => (clickable ? { onClick: () => onPart(key), style: { cursor: "pointer" }, className: g.selPart === key ? "part sel" : "part" } : {});
  const sel = (key) => g.selPart === key && clickable;
  const outline = bodyOutline(B);
  const cells = useMemo(() => scaleCells(F), [F]);
  const sideCuts = ["belly", "back", "spine"].map((k) => g.cuts[`${g.side}_${k}`]).filter(Boolean);

  const zeigoMarks = [];
  for (let x = 396; x <= 590; x += 8) {
    let removed = false;
    if (g.cuts.zeigo) { const t = F.targets.zeigo; const bi = clamp(Math.floor((x - t.a) / (t.b - t.a) * NBIN), 0, NBIN - 1); removed = g.cuts.zeigo.devBins[bi] != null; }
    if (!removed) zeigoMarks.push(html`<path key=${x} d=${`M${x + 3} ${B.CY - 6} L${x - 3} ${B.CY - 1} L${x + 3} ${B.CY + 4}`} fill="none" stroke="#e8e2c8" stroke-width="1.6" opacity="0.95"/>`);
  }
  const lat = F.lateral.arch;
  const latD = `M${lat[0][0]} ${lat[0][1]} C${lat[1][0]} ${lat[1][1]} ${lat[2][0]} ${lat[2][1]} ${lat[3][0]} ${lat[3][1]} S${lat[4][0] - 10} ${lat[4][1]} ${lat[4][0]} ${lat[4][1]} L${B.X1} ${B.CY - 1}`;
  const clipDev = g.cuts.head ? g.cuts.head.meanSigned : 0;
  const tr = mirrored ? `translate(${MIRROR_C} 0) scale(-1 1)` : undefined;
  const liveStroke = live && drawMode === "line" ? live : null;

  return html`<svg ref=${svgRef} viewBox=${`${VIEW.x} ${VIEW.y} ${VIEW.w} ${VIEW.h}`} className=${drawMode !== "none" ? "draw" : ""}
      role="img" aria-label="まな板の上の魚" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}>
    <${FishDefs}/>
    <${Board} cloth=${!!g.prepDone.board}/>

    <clipPath id="bodyClip"><path d=${outline}/></clipPath>
    <g transform=${tr}>
      <ellipse cx="410" cy=${B.CY + 75} rx="270" ry="10" fill="#000" opacity="0.08"/>

          <path d=${latD} fill="none" stroke="#2f4750" stroke-width="1.2" opacity="0.6" pointer-events="none"/>
          ${clickable && html`<path d=${latD} fill="none" stroke=${sel("lateral") ? "#fff" : "transparent"} stroke-opacity="0.6" stroke-width="10" ...${p("lateral")}/>`}
          <g ...${p("zeigo")}>${zeigoMarks}${clickable && html`<rect x="392" y=${B.CY - 8} width="200" height="14" fill=${sel("zeigo") ? "#fff" : "transparent"} opacity="0.4"/>`}</g>
          <path d=${`M206 ${B.top(206) + 10} C220 ${B.CY - 20} 220 ${B.CY + 18} 204 ${B.bot(204) - 8}`} fill="none" stroke="#2f454b" stroke-width="2.2" opacity="0.8" pointer-events="none"/>
          ${clickable && html`<path d=${`M196 ${B.top(196) + 8} C214 ${B.CY - 20} 214 ${B.CY + 18} 196 ${B.bot(196) - 8} L186 ${B.bot(186) - 10} C200 ${B.CY + 10} 200 ${B.CY - 10} 186 ${B.top(186) + 10} Z`} fill=${sel("gill") ? "#fff" : "transparent"} opacity="0.35" ...${p("gill")}/>`}
          <path d=${`M${B.X0 - 6} ${B.CY + 2} Q${B.X0 + 12} ${B.CY + 10} ${B.X0 + 26} ${B.CY + 7}`} fill="none" stroke="#2f454b" stroke-width="1.4" pointer-events="none"/>
          <circle cx=${F.eye.x} cy=${F.eye.y} r=${F.eye.r} fill="#f4f1e6" stroke="#333" stroke-width="1.2" ...${p("eye")}/>
          <circle cx=${F.eye.x + 1} cy=${F.eye.y} r=${F.eye.r * 0.55} fill="#111" pointer-events="none"/>

          <circle cx=${F.anusX} cy=${B.bot(F.anusX) - 3} r="3" fill="#7a5a52" ...${p("anus")}/>
          ${clickable && html`<circle cx=${F.anusX} cy=${B.bot(F.anusX) - 3} r="10" fill="transparent" ...${p("anus")}/>`}
          ${g.cuts.gut && html`<path d=${polyD(targetPts({ axis: "x", a: 216, b: 335, fn: (x) => B.bot(x) - 4 }))} stroke=${g.prepDone.wash ? "#b0574d" : "#4a1c1c"} stroke-width="4" fill="none" stroke-linecap="round"/>`}

        </g>` : html`<g>

        </g>`}
      </g>
      ${guideKeys.map((gk) => html`<${GuideLine} key=${gk.key} t=${F.targets[gk.key]} faint=${gk.faint} arrow=${gk.arrow}/>`)}
      ${draft && html`<path d=${polyD(draft.pts)} fill="none" stroke="var(--draft)" stroke-width="3.5" stroke-dasharray="7 5" stroke-linecap="round" pointer-events="none"/>`}
      ${liveStroke && html`<path d=${polyD(liveStroke)} fill="none" stroke="var(--draft)" stroke-width="3.5" stroke-linecap="round" pointer-events="none"/>`}
    </g>
    ${hintFlash && html`<rect x=${VIEW.x + 6} y=${VIEW.y + 6} width=${VIEW.w - 12} height=${VIEW.h - 18} rx="10" fill="none" stroke="var(--guide)" stroke-width="3" opacity="0.6" pointer-events="none"/>`}
  </svg>`;
}

/* =========================================================
   アプリ本体
   ========================================================= */
function App({ boot }) {
  const [screen, setScreen] = useState(boot.screen || "title");
  const [g, setG] = useState(boot.g || null);
  const [hist, setHist] = useState([]);
  const [draft, setDraft] = useState(null);
  const [extra, setExtra] = useState(boot.extra || { hintsUsed: 0, undos: 0 });
  const [hintUntil, setHintUntil] = useState(0);
  const [resetArmed, setResetArmed] = useState(false);
  const [, force] = useState(0);
  const latest = useRef({});
  latest.current = { screen, g, extra };
  useEffect(() => { try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => latest.current); } catch (_) {} }, []);
  useEffect(() => { if (!hintUntil) return; const t = setTimeout(() => force((n) => n + 1), Math.max(0, hintUntil - Date.now()) + 30); return () => clearTimeout(t); }, [hintUntil]);
  useEffect(() => { if (!resetArmed) return; const t = setTimeout(() => setResetArmed(false), 3500); return () => clearTimeout(t); }, [resetArmed]);

  const F = g ? FISH_LIST.find((f) => f.id === g.fishId) : FISH_LIST[0];
  const mode = g ? MODES[g.modeId] : MODES.practice;

  const cellsRef = useMemo(() => scaleCells(F), [F]);
  const scrubSnap = useRef(null);
  const commit = useCallback((ng) => { setHist((h) => h.concat([g]).slice(-80)); setG(ng); setDraft(null); }, [g]);
  const start = (fishId, modeId) => { setG(newGame(fishId, modeId)); setHist([]); setDraft(null); setExtra({ hintsUsed: 0, undos: 0 }); setScreen("game"); };

  if (screen === "title" || !g) {
    return html`<div className="wrap">
      <header className="top"><div className="brand"><small>料理シミュレーション</small><h1>職人への道！三枚おろしシミュレーター</h1></div></header>
      <${TitleScreen} onStart=${start} initMode=${g && g.modeId}/>
    </div>`;
  }

  const adv = nextAdvice(g, F);
  const hintsLeft = mode.hints === Infinity ? Infinity : mode.hints - extra.hintsUsed;
  const hintActive = Date.now() < hintUntil;

  // ---- 罰点・メッセージのヘルパー ----
  const withPen = (ng, cat, pts, msg) => ({ ...ng, pen: ng.pen.concat([{ cat, pts, msg }]) });
  const say = (ng, kind, title, text, lesson) => ({ ...ng, msg: { kind, title, text }, lesson: lesson === undefined ? ng.lesson : lesson });

  // ---- 確認段階 ----
  const onPart = (key) => {
    if (!key) { setG({ ...g, selPart: null }); return; }
    const part = PARTS[key];
    setG(say({ ...g, selPart: key, seen: g.seen.includes(key) ? g.seen : g.seen.concat([key]) }, "info", part.name, part.text, null));
  };

  // ---- 下処理 ----
  const knifeCheck = (ng) => {
    if (!ng.prepDone.board && !ng.boardLate) {
      return { ...withPen({ ...ng, boardLate: true }, "safety", 4, "まな板を固定する前に刃物を使った"),
        msg: { kind: "warn", title: "安全上の注意", text: "まな板を固定する前に包丁を使おうとしています。まな板が滑ると危険です（安全点から減点）。このまま作業を続けることもできます。" } };
    }
    return ng;
  };
  const choosePrep = (id) => {
    if (g.prepDone[id]) { setG(say(g, "info", "完了済み", "この作業はもう終わっています。")); return; }
    const d = F.distractors.find((x) => x.id === id);
    if (d) { commit(withPen(say(g, "bad", `「${d.label}」は今は行いません`, d.why), "proc", 3, `不要な作業「${d.label}」を選んだ`)); return; }
    const st = F.prep.find((s) => s.id === id);
    const missing = st.req.filter((r) => !g.prepDone[r]);
    if (missing.length) {
      const names = missing.map((r) => F.prep.find((s) => s.id === r).label).join("・");
      commit(withPen(say(g, "bad", "順序が違います", `「${st.label}」の前に「${names}」が必要です。${st.reqWhy || ""}`), "proc", 3, `「${names}」より先に「${st.label}」を選んだ`));
      return;
    }
    let ng = { ...g, activePrep: id };
    ng = say(ng, "info", st.label, st.how, st.lesson);
    if (st.knife) ng = knifeCheck(ng);
    setDraft(null);
    setG(ng);
  };
  const doTap = () => {
    const st = F.prep.find((s) => s.id === g.activePrep); if (!st || st.gesture !== "tap") return;
    const ng = say({ ...g, prepDone: { ...g.prepDone, [st.id]: true }, activePrep: null }, "good", `${st.label}：完了`, st.id === "board" ? "まな板が動かなくなりました。これで安心して包丁を使えます。" : "腹の中がきれいになり、水気も拭き取れました。", st.lesson);
    commit(ng);
  };
  const onScrub = (phase, p, last) => {
    if (phase === "start") { scrubSnap.current = g; return; }
    if (phase === "move") {
      setG((cur) => {
        const clean = cur.scaleClean.slice(); let changed = false;
        cellsRef.forEach((c, i) => {
          if (clean[i]) return;
          const ry = Math.max(14, (c.y1 - c.y0) * 0.6);
          if (Math.abs(p.x - c.x) < c.w * 0.9 + 6 && p.y > c.y0 - ry * 0.5 && p.y < c.y1 + ry * 0.5) { clean[i] = true; changed = true; }
        });
        let good = cur.scaleGood, bad = cur.scaleBad;
        if (last && Math.abs(p.x - last.x) > Math.abs(p.y - last.y)) { if (p.x < last.x) good++; else bad++; }
        return changed || good !== cur.scaleGood || bad !== cur.scaleBad ? { ...cur, scaleClean: clean, scaleGood: good, scaleBad: bad } : cur;
      });
      return;
    }
    if (phase === "end") {
      const before = scrubSnap.current; scrubSnap.current = null;
      if (before) setHist((h) => h.concat([before]).slice(-80));
      setG((cur) => {
        const ratio = cur.scaleClean.filter(Boolean).length / cur.scaleClean.length;
        if (ratio >= 0.9) {
          let ng = { ...cur, prepDone: { ...cur.prepDone, scale: true }, activePrep: null };
          const total = cur.scaleGood + cur.scaleBad;
          if (total > 6 && cur.scaleBad > cur.scaleGood) {
            ng = withPen(ng, "proc", 2, "うろこを頭から尾の方向に取った");
            return say(ng, "warn", "うろこ取り：完了（向きに注意）", "うろこは取れましたが、主に頭から尾の方向にこすっていました。うろこは尾から頭に向かって、うろこの重なりを起こすように取ります。");
          }
          return say(ng, "good", "うろこ取り：完了", `うろこを${Math.round(ratio * 100)}%取りました。尾から頭の方向へ、うろこを起こすように取れています。`);
        }
        return say(cur, "info", "うろこ取り：作業中", `いま${Math.round(ratio * 100)}%です。残っている光ったうろこの部分を、尾から頭の方向へこすってください。`);
      });
    }
  };

  // ---- 線の判定（下処理の線・三枚おろしの線） ----
  const strokeSafety = (ng, stroke, headOff) => {
    let over = false;
    for (const p of stroke.pts) if (outsideDist(F, p, headOff) > 32) { over = true; break; }
    const L = pathLen(stroke.pts);
    const fast = stroke.dur > 0 && (L / stroke.dur > 2.6 || (stroke.dur < 110 && L > 140));
    const notes = [];
    if (over) { ng = { ...ng, overshoot: ng.overshoot + 1 }; notes.push("包丁の線が魚から大きくはみ出しました。刃先の行き先に手がないか注意しましょう。"); }
    if (fast) { ng = { ...ng, fast: ng.fast + 1 }; notes.push("勢いよく引きすぎです。包丁は一定の速さで落ち着いて動かします。"); }
    return { ng, notes };
  };
  const reject = (ng, text) => {
    const pen = mode.id !== "practice";
    let out = say(ng, "warn", "やり直しましょう", text + (pen ? "（手順点 −1）" : "（練習モードなので減点なし）"));
    if (pen) out = withPen(out, "proc", 1, "判定できない位置に包丁を入れた");
    return out;
  };

  const classify = (pts) => {
    const s = g.side; const tol = mode.tol;
    let best = null;
    for (const k of ["belly", "back", "spine"]) {
      const ev = evalStroke(pts, F.targets[k], tol);
      if (ev.n < 3) continue;
      if (!best || ev.meanAbs < best.ev.meanAbs) best = { k, ev };
    }
    if (!best || best.ev.meanAbs > 4 * tol) return null;
    return { ...best, done: !!g.cuts[`${s}_${best.k}`] };
  };

  const onStroke = (stroke) => { setDraft(stroke); };

  const decide = () => {
    if (!draft) return;
    const tol = mode.tol;
    if (g.phase === "prep") {
      const st = F.prep.find((s) => s.id === g.activePrep); if (!st || st.gesture !== "line") return;
      const t = F.targets[st.target];
      const ev = evalStroke(draft.pts, t, tol);
      let { ng, notes } = strokeSafety(g, draft, !!g.prepDone.head);
      if (ev.cov < 0.6 || ev.meanAbs > 4 * tol) {
        commit(reject(ng, ev.cov < 0.6 && ev.meanAbs <= 4 * tol ? `「${st.label}」の線が短すぎます（必要な長さの${Math.round(ev.cov * 100)}%）。${st.how}` : `「${st.label}」の位置から大きく外れています。${st.how}`));
        return;
      }
      ng = { ...ng, cuts: { ...ng.cuts, [st.target]: { ...ev, pts: draft.pts } }, prepDone: { ...ng.prepDone, [st.id]: true }, activePrep: null };
      if (!ev.dirOk && t.dirMsg) { ng = withPen(ng, "proc", 2, `「${st.label}」の向きが逆`); notes.unshift("向きが逆です。" + t.dirMsg); }
      const q = ev.acc >= 0.8 && ev.dirOk ? "good" : ev.acc >= 0.5 ? "warn" : "bad";
      let detail = `目標線からの平均のずれ ${ev.meanAbs.toFixed(1)}（許容 ${tol}）、届いた長さ ${Math.round(ev.cov * 100)}%。`;
      if (st.id === "head") detail += ev.meanSigned > 0.5 * tol ? "後ろ寄りに切ったため、肩の身が少し減りました。" : ev.meanSigned < -0.5 * tol ? "前寄りに切ったため、えらぶたの骨が残りやすい位置です。" : "胸ビレのすぐ後ろで、ちょうどよい位置です。";
      if (st.id === "zeigo" && ev.cov < 0.9) detail += "取り残しのぜいごがあります。";
      ng = say(ng, q, `${st.label}：${!ev.dirOk && t.dir ? "向きが逆です" : q === "good" ? "きれいにできました" : q === "warn" ? "まずまずです" : "ずれが大きいです"}`, detail + (notes.length ? " " + notes.join(" ") : ""), st.lesson);
      commit(ng);
      return;
    }
    if (g.phase === "cut") {
      const s = g.side;
      const cls = classify(draft.pts);
      let { ng, notes } = strokeSafety(g, draft, true);
      if (!cls) { commit(reject(ng, "どの切り込み位置からも大きく外れています。腹の縁・背の縁・中骨のどこを切るのかを決めてから線を引きましょう。")); return; }
      const t = F.targets[cls.k];
      if (cls.done) { setG(say(g, "info", "その切り込みは済んでいます", `${t.name}はもう入れました。${adv.hint}`)); setDraft(null); return; }
      if (cls.k === "spine" && (!g.cuts[`${s}_belly`] || !g.cuts[`${s}_back`])) {
        commit(withPen(say(ng, "bad", "順序が違います", "腹側と背側に切り込みを入れてから、中骨に沿って切り離します。外周の切り込みがないまま切り離そうとすると、身が骨から離れず、無理に引くと身が割れてしまいます。"), "proc", 3, "外周の切り込みより先に中骨の切り離しをしようとした"));
        return;
      }
      const ev = evalStroke(draft.pts, t, tol);
      if (ev.cov < 0.6) { commit(reject(ng, `${t.name}の線が短すぎます（必要な長さの${Math.round(ev.cov * 100)}%）。端から端まで切り進めましょう。`)); return; }
      ng = { ...ng, cuts: { ...ng.cuts, [`${s}_${cls.k}`]: { ...ev, pts: draft.pts } } };
      if (!ev.dirOk) { ng = withPen(ng, "proc", 2, `${s === "A" ? "1" : "2"}枚目の${t.name}の向きが逆`); notes.unshift("向きが逆です。" + t.dirMsg); }
      const q = ev.acc >= 0.8 && ev.dirOk ? "good" : ev.acc >= 0.5 ? "warn" : "bad";
      let detail = `平均のずれ ${ev.meanAbs.toFixed(1)}（許容 ${tol}）、届いた長さ ${Math.round(ev.cov * 100)}%。`;
      if (t.inward) detail += ev.inward > 0.5 * tol ? (q === "good" ? "わずかに身の内側に寄っています。" : "身の内側に入りすぎて、身が削れています。") : ev.outward > 0.8 * tol ? (q === "good" ? "わずかに外側（縁）に寄っています。" : "外側（縁）に寄りすぎて、ヒレの骨が身に残りやすくなります。") : "";
      else if (cls.k === "spine") detail += ev.meanAbs > 0.6 * tol ? "中骨から刃が離れ、骨に身が残りました。" : "中骨にぴったり沿っています。";
      const finishedSide = ng.cuts[`${s}_belly`] && ng.cuts[`${s}_back`] && ng.cuts[`${s}_spine`];
      let title = `${t.name}：${!ev.dirOk ? "向きが逆です" : q === "good" ? "きれいに切れました" : q === "warn" ? "まずまずです" : "ずれが大きいです"}`;
      if (finishedSide && s === "A") { ng = { ...ng, aRemoved: true }; title = "1枚目の身が外れました"; detail += " 片身が中骨から離れました。次は魚を裏返します。"; }
      ng = say(ng, q, title, detail + (notes.length ? " " + notes.join(" ") : ""), F.cutLessons[cls.k]);
      if (finishedSide && s === "B") { ng = { ...ng, phase: "result" }; }
      commit(ng);
    }
  };

  const flip = () => {
    if (!(g.phase === "cut" && g.side === "A" && g.aRemoved)) return;
    commit(say({ ...g, side: "B" }, "info", "裏返しました", "中骨が付いた側を下にしました。頭側は右になります。背側・腹側に切り込みを入れてから、中骨に沿って切り離しましょう。", F.cutLessons.flip));
  };

  const toPrep = () => commit(say({ ...g, phase: "prep", selPart: null, xray: false }, "info", "下処理を始めます", "右の作業ボタンから、次に行う作業を選んでください。魚種や料理によって手順は変わりますが、ここではアジの基本的な手順で進めます。", null));
  const toCut = () => commit(say({ ...g, phase: "cut", activePrep: null }, "info", "三枚おろしを始めます", "頭が左、腹が手前です。1枚目は腹側から切り込みを入れます。魚の上をドラッグして包丁の線を引き、「決定」で判定します。", "三枚おろしは、魚を「上の身・下の身・中骨」の3つに分けるおろし方です。中骨に刃を沿わせて、身を骨から外していきます。"));

  const undo = () => {
    if (draft) { setDraft(null); setG(say(g, "info", "線を消しました", "もう一度、魚の上をドラッグして線を引いてください。")); return; }
    if (!hist.length) { setG(say(g, "info", "取り消せる操作がありません", "これが最初の状態です。")); return; }
    const prev = hist[hist.length - 1];
    setHist(hist.slice(0, -1));
    setExtra({ ...extra, undos: extra.undos + 1 });
    setG(say(prev, "info", "直前の操作を取り消しました", mode.id === "master" ? "職人モードでは「戻る」1回ごとに手順点が1点減ります。" : "もう一度やってみましょう。"));
  };
  const reset = () => {
    if (!resetArmed) { setResetArmed(true); return; }
    setResetArmed(false);
    setG(newGame(g.fishId, g.modeId)); setHist([]); setDraft(null); setExtra({ hintsUsed: 0, undos: 0 });
  };
  const hint = () => {
    if (hintsLeft <= 0) { setG(say(g, "warn", "ヒントは使い切りました", `${mode.name}のヒントは${mode.hints}回までです。`)); return; }
    setExtra({ ...extra, hintsUsed: extra.hintsUsed + 1 });
    setHintUntil(Date.now() + 6000);
    setG(say(g, "info", "ヒント", adv.hint + (mode.guide !== "full" && adv.target ? "（6秒間、包丁を入れる位置を表示します）" : "")));
  };

  // ---- ガイド表示 ----
  let drawMode = "none";
  if (g.phase === "prep" && g.activePrep) { const st = F.prep.find((s) => s.id === g.activePrep); drawMode = st.gesture === "scrub" ? "scrub" : st.gesture === "line" ? "line" : "none"; }
  if (g.phase === "cut" && !(g.side === "A" && g.aRemoved)) drawMode = "line";
  const guideKeys = [];
  const addGuide = (key) => {
    if (!key) return;
    if (mode.guide === "full" || hintActive) guideKeys.push({ key, faint: false, arrow: true });
    else if (mode.guide === "faint") guideKeys.push({ key, faint: true, arrow: false });
  };
  if (g.phase === "prep" && g.activePrep) addGuide(F.prep.find((s) => s.id === g.activePrep).target);
  if (g.phase === "cut" && drawMode === "line") {
    if (mode.guide === "full" || hintActive) addGuide(adv.target);
    else if (mode.guide === "faint") ["belly", "back", "spine"].filter((k) => !g.cuts[`${g.side}_${k}`]).forEach((k) => guideKeys.push({ key: k, faint: true, arrow: false }));
  }
  const draftLabel = (() => {
    if (!draft) return null;
    if (g.phase === "cut") { const c = classify(draft.pts); return c ? `「${F.targets[c.k].name}」として判定します` : "どの切り込みにも当てはまりません"; }
    if (g.phase === "prep" && g.activePrep) return `「${F.prep.find((s) => s.id === g.activePrep).label}」の線として判定します`;
    return null;
  })();

  const prepAll = F.prep.every((s) => g.prepDone[s.id]);
  const prepButtons = ["head", "scale", "skin", "gut", "board", "tail", "zeigo", "wash", "salt"]
    .map((id) => F.prep.find((s) => s.id === id) || F.distractors.find((s) => s.id === id));
  const activeSt = g.activePrep && F.prep.find((s) => s.id === g.activePrep);
  const scalePct = Math.round(100 * g.scaleClean.filter(Boolean).length / g.scaleClean.length);

  let status = "";
  if (g.phase === "inspect") status = "部位をクリックすると説明が出ます";
  else if (drawMode === "scrub") status = `うろこ取り：尾 → 頭の方向にこする（${scalePct}%）`;
  else if (drawMode === "line") status = draft ? draftLabel : "ドラッグして包丁の線を引く";
  else if (g.phase === "cut" && g.aRemoved && g.side === "A") status = "1枚目の身が外れた状態（中骨が見えています）";
  else if (g.phase === "prep") status = activeSt ? "右の「作業する」を押してください" : "右の作業ボタンから作業を選んでください";

  const header = html`<header className="top">
    <div className="brand"><small>料理シミュレーション</small><h1>職人への道！三枚おろしシミュレーター</h1></div>
    <div className="chips"><span className="chip">魚 <b>${F.name}</b></span><span className="chip">難易度 <b>${mode.name}</b></span>
      <span className="chip">ヒント <b>${hintsLeft === Infinity ? "無制限" : `残り${Math.max(0, hintsLeft)}回`}</b></span></div>
  </header>`;

  if (g.phase === "result") {
    return html`<div className="wrap">
      ${header}<${Stepper} phase="result"/>
      <${ResultView} F=${F} g=${g} mode=${mode} extra=${extra}
        onRetry=${() => start(g.fishId, g.modeId)} onTitle=${() => { setScreen("title"); }}/>
      <div className="controls" style=${{ gridTemplateColumns: "repeat(2, minmax(0,1fr))" }}>
        <button id="undo" className="btn" onClick=${undo}>戻る<span className="sub">最後の切り離しをやり直す</span></button>
        <button id="reset" className=${"btn danger" + (resetArmed ? " armed" : "")} onClick=${reset}>${resetArmed ? "もう一度押すとリセット" : "リセット"}</button>
      </div>
    </div>`;
  }

  const sideTray = g.phase === "cut" && g.aRemoved;
  return html`<div className="wrap">
    ${header}
    <${Stepper} phase=${g.phase}/>
    <div className="main">
      <div className="boardcol">
        <div className="boardbox">
          <${FishView} F=${F} g=${g} mode=${mode} guideKeys=${guideKeys} draft=${draft} onPart=${onPart}
            drawMode=${drawMode} onStroke=${onStroke} onScrub=${onScrub} hintFlash=${hintActive}/>
          ${status && html`<div className="status">${status}</div>`}
        </div>
        <div className="controls">
          <button id="undo" className="btn" onClick=${undo}>戻る</button>
          <button id="reset" className=${"btn danger" + (resetArmed ? " armed" : "")} onClick=${reset}>${resetArmed ? "もう一度押す" : "リセット"}</button>
          <button id="hint" className="btn" onClick=${hint} disabled=${hintsLeft <= 0}>ヒント<span className="sub">${hintsLeft === Infinity ? "無制限" : `残り${Math.max(0, hintsLeft)}回`}</span></button>
          <button id="decide" className="btn primary" onClick=${decide} disabled=${!draft}>決定</button>
        </div>
        ${sideTray && html`<div className="tray fadein">
          <svg viewBox="215 100 400 170" role="img" aria-label="外した1枚目の身"><${FishDefs}/><${Fillet} F=${F} g=${g} s="A"/></svg>
          <span>外した身：1枚目${g.side === "B" ? "（2枚目をおろし中）" : ""}</span>
        </div>`}
      </div>

      <aside className="panel">
        <div className="nowbox">
          <span className="eyebrow">いまの工程</span>
          <span className="now">${adv.now}</span>
          <span className="next">次：${adv.next}</span>
        </div>

        ${g.phase === "inspect" && html`<div style=${{ display: "grid", gap: "10px" }}>
          <p>頭は左、腹は手前（画面下）、背は奥（画面上）です。主な部位を確認しましょう。</p>
          <ul className="checks">${KEY_PARTS.map((k) => html`<li key=${k} className=${g.seen.includes(k) ? "ok" : ""}>${g.seen.includes(k) ? "✓ " : ""}${PARTS[k].name}</li>`)}</ul>
          ${mode.id !== "master" && html`<label className="toggle"><input id="xray" type="checkbox" checked=${g.xray} onChange=${(e) => setG({ ...g, xray: e.target.checked })}/>中骨を透かして見る</label>`}
          <button id="to-prep" className="btn primary" onClick=${toPrep}>下処理へ進む</button>
        </div>`}

        ${g.phase === "prep" && html`<div style=${{ display: "grid", gap: "10px" }}>
          <span className="eyebrow">作業ボタン（行う作業を選ぶ）</span>
          <div className="actions">
            ${prepButtons.map((s) => html`<button key=${s.id} id=${"act-" + s.id}
                className=${"btn act" + (g.prepDone[s.id] ? " done" : "") + (g.activePrep === s.id ? " active" : "") + (mode.id === "practice" && adv.suggest === s.id && !g.activePrep ? " suggest" : "")}
                onClick=${() => choosePrep(s.id)}>${g.prepDone[s.id] ? "✓ " : ""}${s.label}</button>`)}
          </div>
          ${activeSt && activeSt.gesture === "tap" && html`<button id="do-tap" className="btn primary" onClick=${doTap}>作業する：${activeSt.label}</button>`}
          ${activeSt && activeSt.gesture === "scrub" && html`<div className="bar" aria-label="うろこ取りの進み具合"><i style=${{ width: scalePct + "%" }}></i></div>`}
          ${prepAll && html`<button id="to-cut" className="btn primary" onClick=${toCut}>三枚おろしへ進む</button>`}
        </div>`}

        ${g.phase === "cut" && html`<div style=${{ display: "grid", gap: "10px" }}>
          <ul className="checks">
            ${["A", "B"].flatMap((s) => (s === "A" ? ["belly", "back", "spine"] : ["back", "belly", "spine"]).map((k) => html`<li key=${s + k} className=${g.cuts[`${s}_${k}`] ? "ok" : ""}>${s === "A" ? "1枚目" : "2枚目"}・${{ belly: "腹", back: "背", spine: "中骨" }[k]}</li>`))}
          </ul>
          ${g.side === "A" && g.aRemoved && html`<button id="flip" className="btn primary" onClick=${flip}>魚を裏返す</button>`}
          ${draftLabel && html`<p className="note">${draftLabel}。よければ「決定」、引き直すならもう一度ドラッグします。</p>`}
        </div>`}

        <${Msg} m=${g.msg}/>
        ${g.lesson && html`<div className="lesson"><b>なぜ？</b> ${g.lesson}</div>`}
      </aside>
    </div>
    <${HowTo}/>
  </div>`;
}

// 自動テスト用の読み取り専用フック（ゲームの動作には影響しない）
window.__sanmaiFish = FISH_LIST[0];
function mount(data) {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(html`<${App} boot=${data && data.g ? data : {}}/>`);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(mount); else mount((hot && hot.data) || {});
})();
</script>
